spring:
  application:
    # The service.name of every span and log line, as ADR 0005 decides.
    name: jjforge-server
  threads:
    virtual:
      enabled: true
  # Each module migrates its own schema from db/migration/<module>, and
  # db/migration/__root holds the event publication registry. Flyway owns the
  # registry's table, so Spring Modulith doesn't create it. A publication
  # stays until its listener completes, and a restart resubmits it.
  modulith:
    runtime:
      flyway-enabled: true
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: delete
      republish-outstanding-events-on-restart: true

# The actuator listens on a port of its own, which the Service and the Ingress
# don't route to, so the internet never sees /actuator/prometheus.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # Buckets, not only a count and a sum, so Grafana can show the p95 latency.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Every trace is kept until the trace store's volume asks for less. Only W3C
  # Trace Context travels, because every binary would forward baggage that a
  # caller sets.
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
    baggage:
      enabled: false
  # Metrics stay with the scrape, as ADR 0005 decides. The OpenTelemetry
  # starter's OTLP registry would push them as well.
  otlp:
    metrics:
      export:
        enabled: false

# One JSON object per line, with the trace of the request that wrote it under
# the names that VictoriaLogs links to the trace.
logging:
  structured:
    format:
      console: ecs
    json:
      rename:
        traceId: trace_id
        spanId: span_id

jjforge:
  vcs:
    target: ${JJFORGE_VCS_TARGET:localhost:50052}
---
# The migration Job: no web server, and the process exits after Flyway.
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
