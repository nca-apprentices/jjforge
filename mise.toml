# The whole toolchain. `mise install` in this directory provides all of it.
[tools]
java = "25.0.2"
gradle = "9.7.1"
node = "24.21.0"
pnpm = "12.6.0"
# mise sets RUSTUP_TOOLCHAIN, which overrides rust/rust-toolchain.toml, so the
# components are listed here too.
rust = { version = "1.98.1", components = "clippy,rustfmt" }
protoc = "36.2"
# Contract and chart linting, as CI runs it.
buf = "1.73.0"
helm = "4.3.0"
# `mise run up` drives podman through its Docker-compatible socket.
docker-compose = "5.5.1"
# `mise run smoke` runs the requests in shared/http/.
hurl = "8.0.1"
# The OpenAPI checks: `mise run spec:lint`, `spec:breaking`, and `spec:trace`.
"npm:@redocly/cli" = "2.54.2"
"github:oasdiff/oasdiff" = "1.32.1"
yq = "4.53.6"
# `mise run lint` checks every Markdown link.
lychee = "0.24.2"
# Static checks in `mise run lint` and `rust:lint`.
actionlint = "1.7.12"
shellcheck = "0.11.0"
hadolint = "2.15.1"
cargo-deny = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
# `mise run fmt` formats every file. `mise run lint` checks the formatting
# and the prose.
dprint = "0.57.4"
ktlint = "1.8.0"
rumdl = "0.2.77"
shfmt = "3.14.1"
vale = "3.22.0"

# Tool configuration and the tasks live under shared/config. `mise tasks` lists
# the tasks. CI runs lint, test, rust:lint, and rust:test.
[task_config]
includes = ["shared/config/mise/tasks"]

[env]
VALE_CONFIG_PATH = "{{config_root}}/shared/config/vale/vale.ini"
