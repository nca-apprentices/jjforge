[tools]
java = "25.0.2"
gradle = "9.7.1"
node = "24.21.0"
pnpm = "12.6.0"
rust = { version = "1.98.1", components = "clippy,rustfmt" }

# Contracts: `buf lint` in shared:lint and the OpenAPI diff in api:breaking.
buf = "1.73.0"
"github:oasdiff/oasdiff" = "1.32.1"

# Static checks in shared:lint: workflows, scripts, Dockerfiles, the chart,
# and Markdown links.
actionlint = "1.7.12"
shellcheck = "0.11.0"
hadolint = "2.15.1"
helm = "4.3.0"
lychee = "0.24.2"

# Dependency checks in rust:lint.
cargo-deny = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"

# Formatting and prose. dprint runs ktlint, rumdl, and shfmt for `mise run
# fmt`, and vale checks the prose.
dprint = "0.57.4"
ktlint = "1.8.0"
rumdl = "0.2.77"
shfmt = "3.14.1"
vale = "3.22.0"

# The docs site in site:build. mise installs zensical with uv.
uv = "0.12.22"
"pipx:zensical" = "0.0.69"

# The local stack and its scenarios. `mise run up` drives podman through its
# Docker-compatible socket, and `mise run e2e` runs shared/e2e/.
docker-compose = "5.5.1"
hurl = "8.0.1"
bats = "1.14.0"

# Tool configuration and the tasks live under shared/config. `mise tasks` lists
# the tasks. CI runs each namespace, such as jvm:lint and jvm:test, as a job.
[task_config]
includes = ["shared/config/mise/tasks"]

[env]
VALE_CONFIG_PATH = "{{config_root}}/shared/config/vale/vale.ini"
