[tools]
java = "25.0.4"
gradle = "9.8.1"
node = "24.21.0"
pnpm = "12.11.2"
rust = { version = "1.99.0", components = "clippy,rustfmt" }

# Contracts: `buf lint` in repo:lint and the OpenAPI diff in api:breaking.
buf = "1.73.0"
"github:oasdiff/oasdiff" = "1.33.0"

# Static checks in repo:lint: workflows, scripts, Dockerfiles, the chart,
# and Markdown links.
actionlint = "1.7.12"
shellcheck = "0.11.0"
hadolint = "2.15.1"
helm = "4.3.0"
lychee = "0.24.2"

# Dependency checks in core:lint.
cargo-deny = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"

# Formatting and prose. dprint runs ktlint, rumdl, and shfmt for `mise run
# fmt`, and vale checks the prose.
dprint = "0.61.1"
ktlint = "1.8.0"
rumdl = "0.2.79"
shfmt = "3.14.1"
vale = "3.24.0"

# The docs site in site:build. mise installs zensical with uv.
uv = "0.13.0"
"pipx:zensical" = "0.0.69"

# The local stack and its scenarios. `mise run up` drives podman through its
# Docker-compatible socket, and `mise run e2e` runs e2e/.
docker-compose = "5.6.0"
hurl = "8.0.1"
bats = "1.14.0"
# The CLI scenarios create repositories through vcs's gRPC until the server
# does.
grpcurl = "1.9.4"

# Tool configuration and the tasks live under config/. `mise tasks` lists
# the tasks. CI runs each namespace, such as server:lint and server:test, as
# a job.
[task_config]
includes = ["config/mise/tasks"]

[env]
VALE_CONFIG_PATH = "{{config_root}}/config/vale/vale.ini"
