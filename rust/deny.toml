# `mise run rust:lint` checks every dependency against this file with
# cargo-deny.

[advisories]
# A crate with a known vulnerability, or one that was yanked, fails the check.
yanked = "deny"

[licenses]
# Permissive licenses only, so jf and vcsd stay Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# Two versions of one crate build slower but work, so they only warn.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
