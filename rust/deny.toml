# `mise run rust:lint` checks every dependency against this file with
# cargo-deny.

[advisories]
# A crate with a known vulnerability, or one that was yanked, fails the check.
yanked = "deny"

[licenses]
# Permissive licenses only, so jf and vcs stay Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  # Mozilla's root certificates, which rustls-platform-verifier carries.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "WTFPL",
  "Zlib",
]

# The pager of jj-cli reaches it through dirs. MPL-2.0 binds only its own
# files, which jjforge doesn't change.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
# Two versions of one crate build slower but work, so they only warn.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
