[workspace]
resolver = "3"
members = ["cli", "proto", "vcsd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/nca-apprentices/jjforge"

[workspace.dependencies]
jjforge-proto = { path = "proto" }

anyhow = "1.0.104"
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
