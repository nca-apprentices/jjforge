[workspace]
resolver = "3"
members = ["cli", "proto", "vcs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/nca-apprentices/jjforge"
# Shipped as binaries and images, never to crates.io.
publish = false

[workspace.dependencies]
jjforge-proto = { path = "proto" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
http = "1.5.0"
metrics = "0.24.6"
# The push gateway would pull in a TLS stack that /metrics doesn't need.
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
prost = "0.14.4"
# The protoc that tonic-prost-build runs, so no system protoc is needed.
protoc-bin-vendored = "3.3.0"
# The TLS stack jf uses: rustls on ring, with the roots of the platform.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"

# Every crate opts in with `[lints] workspace = true`. clippy.toml lets tests
# unwrap, since a panic there is the failure.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
