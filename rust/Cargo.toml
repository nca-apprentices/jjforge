[workspace]
resolver = "3"
members = ["cli", "proto", "vcsd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/nca-apprentices/jjforge"
# Shipped as binaries and images, never to crates.io.
publish = false

[workspace.dependencies]
jjforge-proto = { path = "proto" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

# Every crate opts in with `[lints] workspace = true`. clippy.toml lets tests
# unwrap, since a panic there is the failure.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
