# The Rust workspace: the CLI, vcsd, and the stubs for proto/. `mise install`
# and the tasks here need nothing from the rest of the repository.
[tools]
# mise sets RUSTUP_TOOLCHAIN, which overrides rust-toolchain.toml, so the
# components are listed here too.
rust = { version = "1.94.1", components = "clippy,rustfmt" }
protoc = "36.1"

[tasks.fmt]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Check the Rust formatting and clippy lints"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.test]
description = "Run the Rust tests"
run = "cargo test --workspace"
