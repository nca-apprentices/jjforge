# Deliberate exceptions to shared/config/redocly.yaml.
../openapi.yaml:
  # A browser sign-in only ever redirects.
  operation-2xx-response:
    - "#/paths/~1oauth~1authorize/get/responses"
  # The activity stream's events. OpenAPI 3.1 can't reference a schema from a
  # text/event-stream response, so only the operation's description names it.
  no-unused-components:
    - "#/components/schemas/Activity"
