# Evaluation tier: one command, one machine, no Kubernetes. Same images and the
# same configuration surface as the Helm chart. `--build` builds them from the
# repository root instead of pulling a release. The external systems run as
# the twins of ADR 0004.
name: jjforge

# The connection to the postgres twin, for the server and its migration, as
# the image's own superuser.
x-database: &database
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
  SPRING_DATASOURCE_USERNAME: postgres

services:
  server:
    image: ghcr.io/nca-apprentices/jjforge-server:${JJFORGE_VERSION:-latest}
    build:
      context: ../..
      dockerfile: jvm/Dockerfile
    depends_on:
      vcs:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      oidc:
        condition: service_started
      traces:
        condition: service_started
    environment:
      <<: *database
      SPRING_FLYWAY_ENABLED: "false"
      JJFORGE_VCS_TARGET: vcs:50052
      # The principal of twins/principals that the server calls vcs as.
      JJFORGE_VCS_PRINCIPAL: server
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://traces:10428/insert/opentelemetry/v1/traces
    ports:
      - "${JJFORGE_PORT:-8080}:8080"

  # Migrates the database and exits before the server starts, as the chart's
  # migration Job does.
  migrate:
    image: ghcr.io/nca-apprentices/jjforge-server:${JJFORGE_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      SPRING_PROFILES_ACTIVE: migrate

  # Keeps the repositories in the seaweedfs bucket that `bucket` creates,
  # and knows the principals of twins/principals, whose names a request
  # carries until sign-in exists, as #6 plans.
  # `jf` reaches sync/v1 on JJFORGE_SYNC_PORT, and the scenarios create
  # repositories through gRPC on JJFORGE_VCS_PORT until the server does, as
  # #25 decides.
  vcs:
    image: ghcr.io/nca-apprentices/jjforge-vcs:${JJFORGE_VERSION:-latest}
    build:
      context: ../..
      dockerfile: rust/vcs/Dockerfile
    depends_on:
      bucket:
        condition: service_completed_successfully
      traces:
        condition: service_started
    environment:
      VCS_ADDR: 0.0.0.0:50052
      VCS_SYNC_ADDR: 0.0.0.0:8081
      VCS_STORE: s3://jjforge
      VCS_PRINCIPALS: /etc/vcs/principals
      # The twin checks no key, but the S3 client signs every request.
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: twin
      AWS_SECRET_ACCESS_KEY: twin
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://traces:10428/insert/opentelemetry/v1/traces
    ports:
      - "${JJFORGE_SYNC_PORT:-8081}:8081"
      - "${JJFORGE_VCS_PORT:-50052}:50052"
    volumes:
      - ./twins/principals:/etc/vcs/principals:ro

  # Creates the bucket of vcs once seaweedfs answers, and exits.
  bucket:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    depends_on:
      - seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until echo "s3.bucket.create -name jjforge" | weed shell -master=seaweedfs:9333 2>&1
        | grep -qE "created bucket|already exists"; do sleep 1; done

  # The server's state of ADR 0002. A twin holds test data only, so it lives
  # as long as the container, and it trusts every connection, so no password
  # exists. The check goes over TCP, which the image's setup server doesn't
  # listen on. `mise run jvm:serve` reaches it on the host port.
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${JJFORGE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: pg_isready --host 127.0.0.1 --username postgres
      interval: 1s
      retries: 30

  # The object store of ADR 0002, through its S3 API on port 8333. Without a
  # signing key, SeaweedFS logs an error that its unused STS service has none.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3
    environment:
      WEED_JWT_FILER_SIGNING_KEY: twin-only-key-that-signs-nothing-real

  # The OpenID Connect provider of each organization, one issuer per
  # organization, such as http://oidc:8080/acme, for the server's sign-in
  # of #6.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    environment:
      JSON_CONFIG_PATH: /config/oidc.json
    volumes:
      - ./twins/oidc.json:/config/oidc.json:ro
    ports:
      - "${JJFORGE_OIDC_PORT:-8090}:8080"

  # The trace store of ADR 0005. In the cluster an OpenTelemetry Collector
  # stands in front of it, and here both binaries write to it. `mise run e2e`
  # reads traces from it, and its UI is at /select/vmui.
  # A trace ID waits 20 seconds for the index by default, longer than the
  # check waits.
  traces:
    image: victoriametrics/victoria-traces:v0.12.0@sha256:80919fcc85cc6dd87f598d20ccf42d0ab1120de8f25d4dcf08c5ea2515a496ba
    command: -insert.indexFlushInterval=1s
    ports:
      - "${JJFORGE_TRACES_PORT:-10428}:10428"
