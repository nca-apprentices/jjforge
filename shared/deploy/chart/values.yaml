# Secrets for pulling the server and vcs images, such as [{ name: ghcr }].
imagePullSecrets: []

# Such as prod, so the pods schedule ahead of lower environments.
priorityClassName: ""

server:
  image:
    repository: ghcr.io/nca-apprentices/jjforge-server
    tag: ""
  replicas: 1
  # The app secret of the CloudNativePG cluster that the infra repository runs
  # for this release, such as jjforge-db-app. No default, so a release never
  # migrates a database it wasn't given.
  database:
    secretName: ""
  # A secret with the files `server` and `server-cert.pub`: the server's SSH
  # key and the certificate that opens its session with vcs. Empty calls vcs
  # without a session, which only echo/v1 accepts.
  vcsCredentialSecretName: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

vcs:
  image:
    repository: ghcr.io/nca-apprentices/jjforge-vcs
    tag: ""
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }
  # Sync of ADR 0001, off while store is empty. With a store, vcs serves
  # sync/v1 at /sync/v1 of the ingress host, and keeps jj's index in an
  # emptyDir.
  sync:
    # The object store of the repositories, such as s3://jjforge.
    store: ""
    # The S3 API, such as http://seaweedfs-s3:8333. Empty means AWS.
    endpoint: ""
    region: us-east-1
    # A secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for the store.
    secretName: ""
    # The certificate authorities vcs trusts, as ADR 0002 decides, each with
    # the organization it signs for and its public key in OpenSSH form, such
    # as [{org: 0199c9a0-0000-7000-8000-00000000ac3e, publicKey: "ssh-ed25519 AAAA..."}].
    authorities: []
    # A secret with VCS_SESSION_KEY, the key in hex that seals sessions on
    # every replica. Empty lets each replica draw its own, which holds for one
    # replica only.
    sessionSecretName: ""
    # A secret with the file `signing-key`, the unencrypted OpenSSH key that
    # vcs signs each operation with, as ADR 0001 decides. Empty leaves
    # operations unsigned.
    signingKeySecretName: ""

# Where the server and vcs send traces over OTLP/HTTP, as ADR 0005 decides,
# such as http://telemetry.observability.svc:4318/v1/traces. Empty sends none.
telemetry:
  tracesEndpoint: ""
  # The deployment.environment.name of every span, such as prod.
  environment: ""

ingress:
  enabled: true
  className: traefik
  host: jjforge.example.com
  # Traefik Middlewares in the release's namespace that every request passes,
  # such as [github-login].
  middlewares: []
  # The Middlewares of /sync/v1, which jf reaches with a session and no
  # login page, such as [no-cookies].
  syncMiddlewares: []
  tls:
    enabled: true
    secretName: jjforge-tls
    # A cert-manager ClusterIssuer, such as letsencrypt, that issues the
    # certificate into secretName and deletes it along with the Ingress. Empty
    # leaves the secret to someone else.
    issuer: ""
