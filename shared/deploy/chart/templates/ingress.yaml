{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jjforge.fullname" . }}
  labels:
    {{- include "jjforge.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- with .Values.ingress.middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ range $i, $name := . }}{{ if $i }},{{ end }}{{ $.Release.Namespace }}-{{ $name }}@kubernetescrd{{ end }}
    {{- end }}
    {{- with .Values.ingress.tls.issuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}
                port:
                  name: http
{{- end }}
{{- if and .Values.ingress.enabled .Values.vcs.sync.store }}
---
# sync/v1 on the same host, without the middlewares, since jf sends a bearer
# token that vcs verifies itself and passes no login page. Traefik routes the
# longer path here and the rest to the server.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jjforge.fullname" . }}-sync
  labels:
    {{- include "jjforge.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /sync/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}-vcs
                port:
                  name: sync
{{- end }}
