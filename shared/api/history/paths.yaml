bookmarks:
  get:
    tags:
      - history
    operationId: listBookmarks
    summary: List the bookmarks and their targets
    parameters:
      - $ref: ../common/parameters.yaml#/Org
      - $ref: ../common/parameters.yaml#/Repo
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      "200":
        description: One page of bookmarks.
        content:
          application/json:
            schema:
              $ref: schemas.yaml#/BookmarkPage
            example:
              items:
                - name: main
                  targets:
                    - kmzvqrtsnpwlyxuo
                - name: sync
                  targets:
                    - qpvuntsmwlyxkoqr
                    - rlsmwtpqnzvuxyko
      "401":
        $ref: ../common/responses.yaml#/Unauthenticated
      "404":
        $ref: ../common/responses.yaml#/NotFound

changes:
  get:
    tags:
      - history
    operationId: listChanges
    summary: List the changes reachable from a revision, newest first
    parameters:
      - $ref: ../common/parameters.yaml#/Org
      - $ref: ../common/parameters.yaml#/Repo
      - $ref: ../common/parameters.yaml#/Rev
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      "200":
        description: One page of changes.
        content:
          application/json:
            schema:
              $ref: schemas.yaml#/ChangePage
            example:
              items:
                - changeId: kmzvqrtsnpwlyxuo
                  commitId: 5e1c9a7b3d2f4e6a8b0c1d2e3f4a5b6c7d8e9f01
                  description: "Add the sync endpoint\n"
                  author: &alice
                    name: Alice
                    email: alice@example.com
                    time: "2026-10-14T16:20:00Z"
                  parents: &parents
                    - a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5
                  conflicted: false
                  bookmarks: &bookmarks
                    - main
              next: Y2hhbmdlOmttenZxcnRz
      "401":
        $ref: ../common/responses.yaml#/Unauthenticated
      "404":
        $ref: ../common/responses.yaml#/NotFound
      "422":
        $ref: ../common/responses.yaml#/Ambiguous

change:
  get:
    tags:
      - history
    operationId: getChange
    summary: Show one change
    description: "`rev` is a change ID, a commit ID, a unique prefix of either, or a bookmark."
    parameters:
      - $ref: ../common/parameters.yaml#/Org
      - $ref: ../common/parameters.yaml#/Repo
      - $ref: ../common/parameters.yaml#/RevPath
    responses:
      "200":
        description: The change.
        content:
          application/json:
            schema:
              $ref: schemas.yaml#/Change
            example:
              changeId: kmzvqrtsnpwlyxuo
              commitId: 5e1c9a7b3d2f4e6a8b0c1d2e3f4a5b6c7d8e9f01
              description: "Add the sync endpoint\n"
              author: *alice
              parents: *parents
              conflicted: false
              bookmarks: *bookmarks
              committer: *alice
              files:
                - path: rust/vcs/src/sync.rs
                  status: added
                  conflicted: false
                - path: rust/vcs/src/lib.rs
                  status: modified
                  conflicted: false
      "401":
        $ref: ../common/responses.yaml#/Unauthenticated
      "404":
        $ref: ../common/responses.yaml#/NotFound
      "422":
        $ref: ../common/responses.yaml#/Ambiguous

evolution:
  get:
    tags:
      - history
    operationId: getEvolution
    summary: List the earlier versions of a change, newest first
    parameters:
      - $ref: ../common/parameters.yaml#/Org
      - $ref: ../common/parameters.yaml#/Repo
      - $ref: ../common/parameters.yaml#/RevPath
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      "200":
        description: One page of versions.
        content:
          application/json:
            schema:
              $ref: schemas.yaml#/VersionPage
            example:
              items:
                - commitId: 5e1c9a7b3d2f4e6a8b0c1d2e3f4a5b6c7d8e9f01
                  time: "2026-10-14T16:20:00Z"
                  operationId: c0ffee12d34db5e6f7a8b9c0d1e2f3a4b5c6d7e8
      "401":
        $ref: ../common/responses.yaml#/Unauthenticated
      "404":
        $ref: ../common/responses.yaml#/NotFound
      "422":
        $ref: ../common/responses.yaml#/Ambiguous

operations:
  get:
    tags:
      - history
    operationId: listOperations
    summary: List the operations that changed the repository, newest first
    parameters:
      - $ref: ../common/parameters.yaml#/Org
      - $ref: ../common/parameters.yaml#/Repo
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      "200":
        description: One page of operations.
        content:
          application/json:
            schema:
              $ref: schemas.yaml#/OperationPage
            example:
              items:
                - id: c0ffee12d34db5e6f7a8b9c0d1e2f3a4b5c6d7e8
                  time: "2026-10-14T16:20:00Z"
                  principal:
                    id: 0b9f6c1e-4d2a-4f8e-9a51-3c7d2e8b6a10
                    kind: human
                    name: alice
                  description: push bookmark main
                  parents:
                    - b1a2c3d4e5f60718293a4b5c6d7e8f9012345678
      "401":
        $ref: ../common/responses.yaml#/Unauthenticated
      "404":
        $ref: ../common/responses.yaml#/NotFound
