syntax = "proto3";

package source.v1;

import "google/protobuf/timestamp.proto";
import "source/v1/diff.proto";
import "source/v1/repo.proto";

option java_multiple_files = true;
option java_package = "dev.nca.jjforge.source.v1";

// Reads the history of a repository at a given operation.
service HistoryService {
  // Resolves a change ID, a commit ID, a unique prefix of either, or a
  // bookmark. An empty revision is the trunk bookmark: main, master, or
  // trunk. Every call that takes a revision answers an ambiguous one with
  // FAILED_PRECONDITION, and its google.rpc.Status details hold an
  // AmbiguousRevision.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Streams one page of the changes reachable from a revision, newest
  // first, without the root commit. The last change of the page names the
  // next page.
  rpc Log(LogRequest) returns (stream LogResponse);
  // The change and the first page of the files it touches.
  rpc GetChange(GetChangeRequest) returns (GetChangeResponse);
  // Lists the versions of a change, newest first: the current one, then each
  // earlier one.
  rpc GetEvolution(GetEvolutionRequest) returns (GetEvolutionResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksResponse);
  // Streams each operation that moves the head, oldest first: those after
  // `since`, then each new one as it lands. NOT_FOUND means `since` isn't in
  // the log, and the caller starts again from an operation it is.
  rpc WatchOperations(WatchOperationsRequest) returns (stream WatchOperationsResponse);
}

message Signature {
  string name = 1;
  string email = 2;
  google.protobuf.Timestamp time = 3;
}

message Change {
  string change_id = 1;
  string commit_id = 2;
  string description = 3;
  Signature author = 4;
  Signature committer = 5;
  // Bounded: one parent, or the few parents of a merge.
  repeated string parent_commit_ids = 6;
  bool conflicted = 7;
  // Bounded: the few bookmarks that point at this commit.
  repeated string bookmarks = 8;
}

message ResolveRequest {
  RepoRef repo = 1;
  string rev = 2;
}

message ResolveResponse {
  string change_id = 1;
  string commit_id = 2;
}

// The detail of FAILED_PRECONDITION for a revision that matches more than
// one change.
message AmbiguousRevision {
  string rev = 1;
  // At most 100 of the changes the revision matches, by commit ID.
  repeated Change candidates = 2;
}

message LogRequest {
  RepoRef repo = 1;
  // Empty means the trunk bookmark.
  string rev = 2;
  string page_token = 3;
  // At most 1,000. Zero means 100.
  int32 page_size = 4;
}

message LogResponse {
  Change change = 1;
  // Set on the last change of a page when another page follows.
  string next_page_token = 2;
}

message GetChangeRequest {
  RepoRef repo = 1;
  string rev = 2;
}

message GetChangeResponse {
  Change change = 1;
  // The first page of the files the change touches against its parents, by
  // path, as ListChangedFiles answers it with the default page size.
  repeated ChangedFile files = 2;
  // Set when more files follow. ListChangedFiles, with the same `rev`,
  // answers the next page.
  string files_next_page_token = 3;
}

message GetEvolutionRequest {
  RepoRef repo = 1;
  string rev = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message Version {
  string commit_id = 1;
  google.protobuf.Timestamp time = 2;
  string operation_id = 3;
}

message GetEvolutionResponse {
  repeated Version versions = 1;
  string next_page_token = 2;
}

message ListOperationsRequest {
  RepoRef repo = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message Operation {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  string principal_id = 3;
  string description = 4;
  // Bounded: vcs writes a log without merges, so one parent.
  repeated string parent_ids = 5;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  string next_page_token = 2;
}

message ListBookmarksRequest {
  RepoRef repo = 1;
  string page_token = 2;
  int32 page_size = 3;
}

message Bookmark {
  string name = 1;
  // More than one target means the bookmark is conflicted.
  //
  // Bounded: one target, or the few sides of a conflict.
  repeated string target_change_ids = 2;
}

message WatchOperationsRequest {
  RepoRef repo = 1;
  // The operation the caller saw last. Empty means every operation.
  string since = 2;
}

message WatchOperationsResponse {
  Operation operation = 1;
}

message ListBookmarksResponse {
  repeated Bookmark bookmarks = 1;
  string next_page_token = 2;
}
