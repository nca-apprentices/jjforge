syntax = "proto3";

package source.v1;

option java_multiple_files = true;
option java_package = "dev.nca.jjforge.source.v1";

// Opens the session that every other call of source/v1 carries, as
// `POST /sync/v1/session` does for `jf`. The server signs a challenge with
// the key of its own certificate, as ADR 0002 decides. Both calls need no
// session.
service SessionService {
  // Returns a nonce to sign, valid for a minute.
  rpc GetChallenge(GetChallengeRequest) returns (GetChallengeResponse);
  // Opens a session for the certificate whose key signed the nonce. A
  // refusal answers UNAUTHENTICATED.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
}

message GetChallengeRequest {}

message GetChallengeResponse {
  bytes nonce = 1;
}

message OpenSessionRequest {
  // The certificate in OpenSSH form, as `ssh-keygen -s` writes it.
  string certificate = 1;
  bytes nonce = 2;
  // The SSHSIG over `grpc:source/v1`, a newline, and `nonce`, in the
  // namespace `jjforge-session`, as `ssh-keygen -Y sign` writes it. The
  // audience keeps a signature for this service from opening a session at
  // `POST /sync/v1/session`.
  string signature = 3;
}

message OpenSessionResponse {
  // The session, for `authorization: Bearer {token}`.
  string token = 1;
  // When the session ends, in seconds since the epoch, 15 minutes after it
  // opens at the latest.
  int64 expires_at = 2;
}
