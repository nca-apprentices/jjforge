syntax = "proto3";

package echo.v1;

option java_multiple_files = true;
option java_package = "dev.nca.jjforge.echo.v1";

// Answers with the message it received. vcsd serves it, and the client and the
// server call it, so each hop of the system carries one request.
service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
