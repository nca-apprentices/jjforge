syntax = "proto3";

package vcsd.v1;

option java_multiple_files = true;
option java_package = "dev.nca.jjforge.vcsd.v1";

// The internal contract between the server and vcsd. Nothing outside the
// cluster calls it: see shared/docs/adr/0002-public-protocols.md.
//
// Every call carries the caller's Biscuit token in the `authorization`
// metadata, and vcsd verifies it offline. A RepoRef routes the call to the
// repository's storage.

service RepoService {
  // Creates an empty repository.
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  // Deletes a repository and everything in it.
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  // Returns the current operation head.
  rpc GetHead(GetHeadRequest) returns (GetHeadResponse);
}

message RepoRef {
  // UUIDv7, as ADR 0003 decides.
  string org_id = 1;
  string repo_id = 2;
}

message CreateRepoRequest {
  RepoRef repo = 1;
}

message CreateRepoResponse {}

message DeleteRepoRequest {
  RepoRef repo = 1;
}

message DeleteRepoResponse {}

message GetHeadRequest {
  RepoRef repo = 1;
}

message GetHeadResponse {
  string operation_id = 1;
}
