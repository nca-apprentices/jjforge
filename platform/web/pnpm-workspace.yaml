packages:
  - app
  - features/*
  - shared/*

allowBuilds:
  esbuild: true

# Every version lives here, and a package.json names "catalog:". Strict mode
# makes `pnpm add` write new versions here too.
catalogMode: strict
catalog:
  "@biomejs/biome": 2.6.6
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.107.1
  "@tanstack/react-router": 1.170.46
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.2.1
  clsx: 2.1.1
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  typescript: 7.0.2
  vite: 8.3.6
  vitest: 5.1.0

catalogs:
  # openapi-typescript runs on the TypeScript 5 JavaScript API, which
  # TypeScript 7 no longer has.
  openapi-typescript:
    typescript: 5.9.3
