server {
    listen 8080;
    root /app;

    # Compose mounts the server's paths here. Elsewhere the glob matches
    # nothing, which nginx allows.
    include /etc/nginx/routes/*.conf;

    location / {
        try_files $uri /index.html;
    }

    # Vite names each asset by its hash, so a browser may keep it forever.
    location /assets/ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control immutable;
    }
}
