# The REST contract. The server generates its controller interfaces and models
# from this file at build time.
openapi: 3.1.0
info:
  title: jjforge
  version: v0
paths:
  /api/echo:
    post:
      tags:
        - echo
      operationId: echo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Echo"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Echo"
components:
  schemas:
    Echo:
      type: object
      properties:
        message:
          type: string
      required:
        - message
