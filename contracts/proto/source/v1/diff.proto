syntax = "proto3";

package source.v1;

import "source/v1/repo.proto";

option java_multiple_files = true;
option java_package = "dev.nca.jjforge.source.v1";

// Compares revisions. vcs computes every diff, and no client does.
service DiffService {
  // Streams one page of the changed files, by path, one DiffResponse per
  // file. The last file of the page names the next page.
  rpc Diff(DiffRequest) returns (stream DiffResponse);
  // Lists one page of the changed files, by path, without reading a file.
  // GetChange answers the first page of a change's files and the token that
  // continues them here.
  rpc ListChangedFiles(ListChangedFilesRequest) returns (ListChangedFilesResponse);
}

message DiffRequest {
  RepoRef repo = 1;
  // Either `rev`, compared with its parents, or `from` and `to`.
  string rev = 2;
  string from = 3;
  string to = 4;
  string page_token = 5;
  // At most 1,000. Zero means 100.
  int32 page_size = 6;
}

message DiffResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_ADDED = 1;
    STATUS_MODIFIED = 2;
    STATUS_DELETED = 3;
    STATUS_RENAMED = 4;
  }

  string path = 1;
  // Set for a rename: the path of a deleted file whose content is the
  // same, or whose lines are at least half the same.
  string old_path = 2;
  Status status = 3;
  bool binary = 4;
  // Bounded: at most 1 MiB, as truncated says.
  repeated Hunk hunks = 5;
  // Set when the file's hunks would take more than 1 MiB, or a side is
  // larger than 4 MiB, so vcs sends none and the message stays below gRPC's
  // default limit of 4 MiB. A client reads both sides through FileService
  // instead.
  bool truncated = 6;
  // Set when either side of the file is conflicted, which then has no
  // hunks.
  bool conflicted = 7;
  // Set on the last file of a page when another page follows.
  string next_page_token = 8;
}

message ListChangedFilesRequest {
  RepoRef repo = 1;
  // Either `rev`, compared with its parents, or `from` and `to`.
  string rev = 2;
  string from = 3;
  string to = 4;
  string page_token = 5;
  // At most 1,000. Zero means 100.
  int32 page_size = 6;
}

message ListChangedFilesResponse {
  // At most the page size, and at most 3 MiB.
  repeated ChangedFile files = 1;
  string next_page_token = 2;
}

// A file that a change touches, without its hunks.
message ChangedFile {
  string path = 1;
  // Set for a rename.
  string old_path = 2;
  DiffResponse.Status status = 3;
  // Set when the file is conflicted in the change.
  bool conflicted = 4;
}

message Hunk {
  message Line {
    enum Kind {
      KIND_UNSPECIFIED = 0;
      KIND_CONTEXT = 1;
      KIND_ADDED = 2;
      KIND_REMOVED = 3;
    }

    Kind kind = 1;
    string text = 2;
  }

  int32 old_start = 1;
  int32 old_lines = 2;
  int32 new_start = 3;
  int32 new_lines = 4;
  // Bounded: a file's hunks take at most 1 MiB in all.
  repeated Line lines = 5;
}
