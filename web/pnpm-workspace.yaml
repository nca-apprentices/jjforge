packages:
  - apps/*
  - features/*
  - shared/*

allowBuilds:
  esbuild: true

# Every version lives here, and a package.json names "catalog:". Strict mode
# makes `pnpm add` write new versions here too.
catalogMode: strict
catalog:
  "@biomejs/biome": 2.5.14
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.103.2
  "@tanstack/react-router": 1.170.39
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 5.0.1

catalogs:
  # openapi-typescript runs on the TypeScript 5 JavaScript API, which
  # TypeScript 7 no longer has.
  openapi-typescript:
    typescript: 5.9.3
