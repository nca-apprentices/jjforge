# The docs site, published to GitHub Pages, in the look of
# https://awslabs.github.io/aidlc-workflows. `mise run site:build` copies
# docs into docs/ first, and --strict fails the build on a link to a
# page or heading that doesn't exist.
[project]
site_name = "jjforge"
site_url = "https://jjforge-docs.nca-apprentices.dev/"
repo_url = "https://github.com/nca-apprentices/jjforge"
repo_name = "nca-apprentices/jjforge"
site_dir = "dist"

# The reading order of docs/README.md: the pages for people who use
# jjforge, then the pages for people who build it, then what both look up.
# Directories don't expand here, so scripts/sync-docs.mjs fails on a page
# missing from this list.
nav = [
  { "Overview" = "README.md" },
  { "Using jjforge" = ["concepts.md", "cli.md"] },
  { "Building jjforge" = ["architecture.md", "modules.md", "workflow.md", "development.md"] },
  { "Reference" = [
    { "Specs" = [
      "specs/README.md",
      "specs/23-orgs-and-repos.md",
      "specs/29-push-and-clone.md",
      "specs/143-review-model.md",
    ] },
    { "Decisions" = [
      "adr/README.md",
      { "0001 Native jj without git" = "adr/0001-native-jj-without-git.md" },
      { "0002 State boundaries and tokens" = "adr/0002-state-boundaries-and-tokens.md" },
      { "0003 Checked code rules" = "adr/0003-checked-code-rules.md" },
      { "0004 Specified, tested, built" = "adr/0004-specified-tested-built.md" },
      { "0005 Telemetry through OpenTelemetry" = "adr/0005-telemetry-through-opentelemetry.md" },
      { "0006 Every response is bounded" = "adr/0006-bounded-responses.md" },
    ] },
  ] },
]

[project.theme]
features = [
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.suggest",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "cyan"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

# Setting markdown_extensions replaces Zensical's defaults, so this restates
# them and adds the `yaml table` fence that extensions/yaml_table.py renders.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.arithmatex"]
generic = true
[project.markdown_extensions."pymdownx.betterem"]
[project.markdown_extensions."pymdownx.caret"]
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.keys"]
[project.markdown_extensions."pymdownx.magiclink"]
[project.markdown_extensions."pymdownx.mark"]
[project.markdown_extensions."pymdownx.smartsymbols"]
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid" },
  { name = "yaml", class = "yaml-table", format = "yaml_table.render", validator = "yaml_table.validate" },
]
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
[project.markdown_extensions."pymdownx.tilde"]
