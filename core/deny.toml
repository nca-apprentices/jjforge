# `mise run core:lint` checks every dependency against this file with
# cargo-deny.

[advisories]
# A crate with a known vulnerability, or one that was yanked, fails the check.
yanked = "deny"
# object_store 0.14.2, the latest release, needs chrono and humantime, so no
# upgrade removes them. Both are unmaintained, with no known vulnerability.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "object_store needs chrono, and no release drops it" },
  { id = "RUSTSEC-2026-0542", reason = "object_store needs humantime, and no release drops it" },
]

[licenses]
# Permissive licenses only, so jf and vcs stay Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  # Mozilla's root certificates, which rustls-platform-verifier carries.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "WTFPL",
  "Zlib",
]

# The pager of jj-cli reaches it through dirs. MPL-2.0 binds only its own
# files, which jjforge doesn't change.
[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
# Two versions of one crate build slower but work, so they only warn.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Each layer reaches jj-lib and the object store only through the one above
# it, as ADR 0003 decides.
deny = [
  { crate = "jj-lib", wrappers = ["jj-cli", "jjforge-store"] },
  { crate = "object_store", wrappers = ["jjforge-store"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
