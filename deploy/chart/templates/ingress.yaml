{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jjforge.fullname" . }}
  labels:
    {{- include "jjforge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        # The longest matching path wins, so the server's paths reach the
        # server, and every other path the web app.
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}-web
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}
                port:
                  name: http
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}
                port:
                  name: http
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}
                port:
                  name: http
{{- end }}
{{- if and .Values.ingress.enabled .Values.vcs.sync.store }}
---
# sync/v1 on the same host, in an Ingress of its own with syncAnnotations in
# place of annotations, since jf sends a bearer token that vcs verifies itself
# and passes no login page. Only the other Ingress names a certificate issuer,
# so cert-manager issues the shared secret once. Controllers that merge the
# Ingresses of a host, such as Traefik and ingress-nginx, route the longer path
# here and the rest to the server.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "jjforge.fullname" . }}-sync
  labels:
    {{- include "jjforge.labels" . | nindent 4 }}
  {{- with .Values.ingress.syncAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /sync/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "jjforge.fullname" . }}-vcs
                port:
                  name: sync
{{- end }}
