# The web app's config in compose. Compose has no ingress, so nginx
# forwards /api, /oauth, and /.well-known to the server itself, and serves the
# app for every other path.

server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|oauth|\.well-known)/ {
        proxy_pass http://server:8080;
        # SSE streams events one at a time, so nginx passes each on at once.
        proxy_buffering off;
    }
}
