name: Initiative
description: An outcome and how its success is measured.
title: "I"
type: Initiative
body:
  - type: markdown
    attributes:
      value: Start the title with the next free initiative ID, such as `I8`. [Planning](https://github.com/nca-apprentices/jjforge/blob/main/shared/docs/planning.md) explains the IDs.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true for people once this is done.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success measure
      description: How to tell, from the outside, that the outcome holds.
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
