name: CI

# Nothing here deploys: the infra repository pins a released chart version.
# Lint and test run the same mise tasks as a laptop does.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the same checks on each merge group.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          input: shared/proto
          # The server, vcs, and jf run different versions during a rolling
          # deploy and long after it, so a contract may only grow.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=shared/proto"
          # The summary comment on the PR needs a write permission the
          # workflow doesn't grant. The checks page shows the same result.
          pr_comment: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Lint
        run: mise run shared:lint

  jvm:
    name: JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('jvm/*.gradle.kts') }}
      - name: Lint
        run: mise run jvm:lint
      - name: Test
        run: mise run jvm:test

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Lint
        run: mise run web:lint
      - name: Test
        run: mise run web:test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Only the Rust tools. The rest of the toolchain isn't needed.
          install_args: rust cargo-deny github:bnjbvr/cargo-machete
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Lint
        run: mise run rust:lint
      - name: Test
        run: mise run rust:test
      # The E2E job runs this jf, so it needs no Rust toolchain of its own.
      - name: Build jf
        run: cargo build --manifest-path rust/Cargo.toml --bin jf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jf
          path: rust/target/debug/jf
          retention-days: 1

  # The whole stack in compose, driven through REST and jf as `mise run e2e`
  # drives it on a laptop. It builds nothing: the images and jf come from the
  # jobs that already build them, which run in parallel.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [images, rust]
    env:
      COMPOSE_FILE: shared/deploy/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: docker-compose hurl bats grpcurl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Load
        run: |
          docker load --input "$RUNNER_TEMP/artifacts/image-server/server.tar"
          docker load --input "$RUNNER_TEMP/artifacts/image-vcs/vcs.tar"
          chmod +x "$RUNNER_TEMP/artifacts/jf/jf"
      # The dev certificate authority and keys that compose mounts, which
      # nothing commits.
      - name: Start
        run: |
          shared/deploy/twins/cert server
          docker-compose up --no-build --detach
      # vcs is distroless and has no shell for a compose healthcheck, so the
      # step polls an echo, which passes through both server and vcs.
      - name: Wait
        run: >-
          curl --fail --silent --show-error --retry 120 --retry-delay 1
          --retry-all-errors --json '{"message":"up"}'
          http://localhost:8080/api/v1/echo
      - name: E2E
        run: mise run e2e
        env:
          JF_BIN: ${{ runner.temp }}/artifacts/jf/jf
      - name: Logs
        if: failure()
        run: docker-compose logs

  site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node uv pipx:zensical
      - name: Build
        run: mise run site:build

  images:
    name: Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            dockerfile: jvm/Dockerfile
          - component: vcs
            dockerfile: rust/vcs/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The GitHub Actions cache and a tar output both need the buildx builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Tagged with the name in shared/deploy/compose.yaml, so the E2E job
      # loads the tar and compose finds the image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ghcr.io/nca-apprentices/jjforge-${{ matrix.component }}:latest
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.component }}.tar
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.tar
          retention-days: 1
