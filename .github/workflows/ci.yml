name: CI

# Nothing here deploys: the infra repository pins a released chart version.
# Lint and test run the same mise tasks as a laptop does.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          input: shared/proto
          # The server and vcsd run different versions during a rolling deploy,
          # and the CLI calls echo/v1 until it goes, so the contract may only
          # grow.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=shared/proto"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Lint
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('server/*.gradle.kts') }}

      - name: Test
        run: mise run test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # Only the Rust tools. The rest of the toolchain isn't needed.
          install_args: rust protoc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Lint
        run: mise run rust:lint
      - name: Test
        run: mise run rust:test

  site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - name: Build
        run: mise run site:build

  images:
    name: Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            dockerfile: server/Dockerfile
          - component: vcsd
            dockerfile: rust/vcsd/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
