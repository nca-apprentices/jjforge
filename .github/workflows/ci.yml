name: CI

# Nothing here deploys: the infra repository pins a released chart version.
# Lint and test run the same mise tasks as a laptop does.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          input: shared/proto
          # The server, vcs, and jf run different versions during a rolling
          # deploy and long after it, so a contract may only grow.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=shared/proto"
          # The summary comment on the PR needs a write permission the
          # workflow doesn't grant. The checks page shows the same result.
          pr_comment: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Lint
        run: mise run shared:lint

  jvm:
    name: JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('jvm/*.gradle.kts') }}
      - name: Lint
        run: mise run jvm:lint
      - name: Test
        run: mise run jvm:test

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Lint
        run: mise run web:lint
      - name: Test
        run: mise run web:test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # Only the Rust tools. The rest of the toolchain isn't needed.
          install_args: rust protoc cargo-deny github:bnjbvr/cargo-machete
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Lint
        run: mise run rust:lint
      - name: Test
        run: mise run rust:test

  site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - name: Build
        run: mise run site:build

  images:
    name: Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            dockerfile: jvm/Dockerfile
          - component: vcs
            dockerfile: rust/vcs/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
