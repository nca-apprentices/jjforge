name: Close epic

# Closes an Epic once its last sub-issue closes. An initiative closes by hand,
# once its success measure is met. See shared/docs/planning.md.
on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    name: Close epic
    runs-on: ubuntu-latest
    steps:
      - name: Close the parent epic when nothing under it is open
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT: ${{ github.event.issue.parent_issue_url }}
        run: |
          if [[ -z $PARENT ]]; then
            exit 0
          fi

          number=$(gh api "${PARENT#https://api.github.com/}" --jq '
            select(.type.name == "Epic" and .state == "open")
            | select(.sub_issues_summary.completed == .sub_issues_summary.total)
            | .number')
          if [[ -n $number ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Every sub-issue is closed."
          fi
