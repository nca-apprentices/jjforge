name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # One version ships everything: server image, vcsd image, client binaries,
  # chart and OpenAPI document all carry the same tag.
  server-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/jjforge-server:${{ github.ref_name }}

  vcsd-image:
    name: vcsd image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/vcsd/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/jjforge-vcsd:${{ github.ref_name }}

  client:
    name: Client binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}
      - name: Build
        working-directory: rust
        run: cargo build --release --bin jjforge
      # Each binary is named after its target, so the release lists one per
      # platform.
      - name: Name
        run: cp rust/target/release/jjforge jjforge-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: jjforge-${{ matrix.target }}
          path: jjforge-${{ matrix.target }}

  chart:
    name: Helm chart and OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package
        run: |
          helm registry login ${{ env.REGISTRY }} --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm package chart --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          helm push jjforge-"${GITHUB_REF_NAME#v}".tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: |
            openapi.yaml
            jjforge-*.tgz

  # One GitHub release per tag, created once everything has shipped, with the
  # client binaries, the chart, and the OpenAPI document attached.
  release:
    name: GitHub release
    needs: [server-image, vcsd-image, client, chart]
    runs-on: ubuntu-latest
    steps:
      # Only this workflow's own artifacts: the image jobs also upload
      # .dockerbuild records, which don't belong in the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: jjforge-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
