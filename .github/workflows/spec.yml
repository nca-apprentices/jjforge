name: Spec

# Checks shared/openapi.yaml against the issues and against main. Its own
# workflow, because an edit to the PR's title or body reruns it and should
# rerun nothing else.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  spec:
    name: Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm yq github:oasdiff/oasdiff
      # The requirements on the PR's "Satisfies" line need an end-to-end
      # scenario before they merge, not only once they close.
      - name: Every requirement is traced
        run: |
          satisfies=$(grep -Ei '^satisfies' <<<"$PR_BODY" | grep -Eo '[0-9]+' || true)
          # shellcheck disable=SC2086 # One argument per requirement.
          mise run spec:trace $satisfies
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
      # A breaking change passes only when the PR title marks it, as in
      # "feat!: drop the echo operation".
      - name: No unmarked breaking change
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '!:')
        run: mise run spec:breaking "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
