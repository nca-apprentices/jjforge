name: Spec

# Checks a PR against the spec pages and the REST contract against its base.
# Its own workflow, because an edit to the PR's title or body reruns it and
# should rerun nothing else.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  spec:
    name: Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm github:oasdiff/oasdiff
      # A build PR closes its requirement, and the base branch must already
      # hold a spec section headed with that number, as ADR 0009 decides.
      # A closed task or bug needs no section.
      - name: Every closed requirement is specified
        run: |
          closes=$(grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$PR_BODY" | grep -Eo '[0-9]+' || true)
          # shellcheck disable=SC2086 # One word per issue.
          for n in $closes; do
            if [[ $(gh issue view "$n" --json issueType -q .issueType.name) != Requirement ]]; then
              continue
            fi
            if ! git grep -qE "^##+ .*\(#$n\)" "origin/$BASE" -- 'shared/docs/specs/*.md'; then
              echo "::error::#$n closes with this PR, but no spec page on $BASE has a section headed with (#$n)"
              exit 1
            fi
          done
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
      # A breaking change passes only when the PR title marks it, as in
      # "feat!: drop the echo operation".
      - name: No unmarked breaking change
        if: ${{ !contains(github.event.pull_request.title, '!:') }}
        run: mise run api:breaking "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
