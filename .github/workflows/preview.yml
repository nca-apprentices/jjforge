name: Preview

# Pushes the server and vcs images of a PR labeled preview, tagged with its
# head commit. The jjforge-preview ApplicationSet in nca-apprentices/infra
# then runs them at jjforge-pr-<number>.nca-apprentices.dev and records a
# GitHub deployment once the commit is live. It removes the preview when the
# PR merges, closes, or loses the label. A fork PR gets no token to push with,
# so it gets no preview.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Each image builds natively on one runner per architecture and is pushed
  # by digest only. The manifests job then puts both digests under the tag.
  images:
    name: Image
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, vcs]
        arch: [amd64, arm64]
        include:
          - component: server
            dockerfile: jvm/Dockerfile
          - component: vcs
            dockerfile: rust/vcs/Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # The head commit, which the preview's chart comes from, not the merge
      # commit a PR checks out by default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The cache the CI workflow's Images job writes, which only the amd64
      # build can hit.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/jjforge-${{ matrix.component }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}
      # The digest travels to the manifests job as an empty file named after it.
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Image manifest
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, vcs]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.component }}-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the manifest list
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jjforge-${{ matrix.component }}
          TAG: ${{ github.event.pull_request.head.sha }}
        run: |
          digests=(*)
          docker buildx imagetools create --tag "$IMAGE:$TAG" "${digests[@]/#/$IMAGE@sha256:}"
