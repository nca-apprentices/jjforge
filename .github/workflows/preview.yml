name: Preview

# Pushes the server and vcs images of a PR labeled preview, tagged with its
# head commit. The jjforge-preview ApplicationSet in nca-apprentices/infra
# then runs them at jjforge-pr-<number>.nca-apprentices.dev and records a
# GitHub deployment once the commit is live. It removes the preview when the
# PR merges, closes, or loses the label. A fork PR gets no token to push with,
# so it gets no preview.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Images
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: server
            dockerfile: jvm/Dockerfile
          - component: vcs
            dockerfile: rust/vcs/Dockerfile
    steps:
      # The head commit, which the preview's chart comes from, not the merge
      # commit a PR checks out by default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The cache the CI workflow's Images job writes.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jjforge-${{ matrix.component }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
