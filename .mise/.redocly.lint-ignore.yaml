# Deliberate exceptions to .mise/redocly.yaml.
../contracts/openapi/openapi.yaml:
  # The local stack of `mise run up`, so the docs can send requests to it.
  no-server-example.com:
    - "#/servers/0/url"
../contracts/openapi/auth/paths.yaml:
  # A browser sign-in only ever redirects.
  operation-2xx-response:
    - "#/authorize/get/responses"
  # Takes the bearer token but lists no 401. Open until #11 says whether
  # revocation needs a token.
  rule/authenticated-answers-401:
    - "#/revoke/post/responses"
